<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#66fcf1" />
      <stop offset="100%" stop-color="#45a29e" />
    </linearGradient>

    <linearGradient id="lightningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" rx="20" fill="url(#bgGlow)" stroke="#222b38" stroke-width="2"/>
  
  <!-- Subtle Background Grid/Aura -->
  <circle cx="210" cy="225" r="160" fill="#00f5d4" opacity="0.08" filter="url(#neonGlow)"/>
  <circle cx="800" cy="180" r="140" fill="#9d4edd" opacity="0.06" filter="url(#neonGlow)"/>

  <!-- Left Icon: Stylized Gothic Necromancer Skull & Crossed Shovels -->
  <g transform="translate(70, 75)">
    <!-- Crossed Shovels / Bone shafts -->
    <path d="M 60 70 L 220 230 M 220 70 L 60 230" stroke="#3a475a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Skull Cranium -->
    <path d="M 140 40 
             C 80 40, 60 90, 60 140 
             C 60 180, 85 200, 100 215 
             L 100 245 
             L 180 245 
             L 180 215 
             C 195 200, 220 180, 220 140 
             C 220 90, 200 40, 140 40 Z" 
          fill="#1c2431" stroke="url(#cyanGreen)" stroke-width="5" filter="url(#subtleGlow)"/>

    <!-- Eye Sockets (Glowing Neon Teal) -->
    <path d="M 95 130 C 85 130, 80 145, 85 160 C 90 170, 105 170, 115 160 C 120 150, 115 130, 95 130 Z" fill="#00f5d4" filter="url(#subtleGlow)"/>
    <circle cx="102" cy="148" r="4" fill="#ffffff" />

    <path d="M 185 130 C 195 130, 200 145, 195 160 C 190 170, 175 170, 165 160 C 160 150, 165 130, 185 130 Z" fill="#00f5d4" filter="url(#subtleGlow)"/>
    <circle cx="178" cy="148" r="4" fill="#ffffff" />

    <!-- Triangular Nasal Cavity -->
    <polygon points="140,165 132,185 148,185" fill="#00f5d4" opacity="0.8"/>

    <!-- Teeth / Grate -->
    <rect x="110" y="222" width="12" height="18" rx="2" fill="#2d3748" stroke="#00f5d4" stroke-width="1.5"/>
    <rect x="126" y="222" width="12" height="18" rx="2" fill="#2d3748" stroke="#00f5d4" stroke-width="1.5"/>
    <rect x="142" y="222" width="12" height="18" rx="2" fill="#2d3748" stroke="#00f5d4" stroke-width="1.5"/>
    <rect x="158" y="222" width="12" height="18" rx="2" fill="#2d3748" stroke="#00f5d4" stroke-width="1.5"/>

    <!-- Frankenstein Crack & Lightning Bolt -->
    <path d="M 140 38 L 135 75 L 148 90 L 138 120" stroke="#ff4757" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <!-- Lightning Bolt Overlay -->
    <polygon points="144,30 130,70 145,70 135,115 160,65 145,65" fill="url(#lightningGlow)" filter="url(#neonGlow)"/>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(360, 130)">
    <!-- Hackathon & Track Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="365" height="30" rx="15" fill="rgba(157, 78, 221, 0.2)" stroke="#9d4edd" stroke-width="1.5"/>
      <text x="182" y="20" fill="#d8b4fe" font-family="'Segoe UI', 'Ubuntu', sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" text-anchor="middle">
        🎃 KIROWEEN 2026 // TRACK: FRANKENSTEIN
      </text>
    </g>

    <!-- Project Title -->
    <text x="0" y="85" fill="url(#cyanGreen)" font-family="'Segoe UI', 'Impact', sans-serif" font-weight="900" font-size="64" letter-spacing="3" filter="url(#subtleGlow)">
      GRAVEDIGGER
    </text>

    <!-- Subtitle -->
    <text x="2" y="125" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="20" letter-spacing="3">
      THE CODEBASE NECROMANCER
    </text>

    <!-- Tech Chimera Line -->
    <text x="2" y="158" fill="#718096" font-family="monospace" font-size="14" letter-spacing="1">
      Git Archeology + AST Syntax Trees + Kiro Hooks
    </text>

    <!-- Author Badge: By Adarsh Panicker -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="260" height="38" rx="8" fill="url(#purpleAccent)" filter="url(#subtleGlow)"/>
      <!-- Inner subtle border -->
      <rect x="2" y="2" width="256" height="34" rx="6" fill="#140b24" />
      <text x="130" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" letter-spacing="1.2" text-anchor="middle">
        BY ADARSH PANICKER
      </text>
    </g>
  </g>
</svg>
